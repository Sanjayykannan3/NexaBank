<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — NexaBank</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">

    <style>

        .auth-page {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .auth-icon {
            width: 55px;
            height: 55px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            border-radius: 15px;
            font-size: 22px;
        }

        .auth-header h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--muted);
            font-size: 14px;
        }

        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.25);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 45px;
            background: #091625;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            color: white;
            font-size: 13px;
            transition: 0.3s;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,140,255,0.1);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0 25px;
            font-size: 12px;
        }

        .remember {
            display: flex;
            gap: 7px;
            align-items: center;
            color: var(--muted);
        }

        .remember input {
            accent-color: var(--primary);
        }

        .forgot {
            color: #8eb8ff;
        }

        .login-submit {
            width: 100%;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
            color: var(--muted);
            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: var(--border);
            flex: 1;
        }

        .social-login {
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            background: transparent;
            border: 1px solid var(--border);
            color: white;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .social-login:hover {
            background: #12243a;
        }

        .signup-text {
            text-align: center;
            margin-top: 25px;
            color: var(--muted);
            font-size: 12px;
        }

        .signup-text a {
            color: #8eb8ff;
            font-weight: 600;
        }

        .security-note {
            margin-top: 20px;
            padding: 12px;
            border-radius: 9px;
            background: rgba(56,211,159,0.06);
            border: 1px solid rgba(56,211,159,0.12);
            display: flex;
            gap: 10px;
            align-items: center;
            color: var(--muted);
            font-size: 10px;
        }

        .security-note i {
            color: var(--success);
        }

        @media (max-width: 500px) {

            .auth-card {
                padding: 25px 20px;
            }

            .auth-header h1 {
                font-size: 29px;
            }
        }

    </style>
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">

        <div class="logo-icon">
            <i class="fa-solid fa-building-columns"></i>
        </div>

        <span>Nexa<span>Bank</span></span>

    </a>

    <a href="index.html" class="secondary-btn">
        <i class="fa-solid fa-arrow-left"></i>
        Back Home
    </a>

</header>


<main class="auth-page">

    <div class="auth-container">

        <div class="auth-header">

            <div class="auth-icon">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h1>Welcome back</h1>

            <p>Sign in to access your NexaBank account.</p>

        </div>


        <div class="auth-card">

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <div class="form-options">

                    <label class="remember">

                        <input type="checkbox">

                        Remember me

                    </label>

                    <a href="#" class="forgot">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="primary-btn login-submit"
                >

                    Sign In

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>


            <div class="divider">
                OR
            </div>


            <button class="social-login">

                <i class="fa-brands fa-google"></i>

                Continue with Google

            </button>


            <div class="signup-text">

                Don't have an account?

                <a href="register.html">
                    Create one
                </a>

            </div>


            <div class="security-note">

                <i class="fa-solid fa-shield-halved"></i>

                <span>
                    Your connection is protected with secure encryption.
                </span>

            </div>

        </div>

    </div>

</main>


<script>

    const togglePassword =
        document.getElementById("togglePassword");

    const password =
        document.getElementById("password");


    togglePassword.addEventListener("click", function () {

        if (password.type === "password") {

            password.type = "text";

            this.innerHTML =
                '<i class="fa-solid fa-eye-slash"></i>';

        } else {

            password.type = "password";

            this.innerHTML =
                '<i class="fa-solid fa-eye"></i>';

        }

    });


    document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            alert(
                "Frontend login is working! Database authentication will be connected later."
            );

        });

</script>

</body>
</html>
